name: E2E

on:
  workflow_call:
  pull_request:
    branches: [ "main" ]
    paths:
      - "Backend/**"
      - "Frontend/**"
      - "E2E/**"
      - "compose.yaml"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      COMPOSE_FILE: compose.yaml:E2E/compose.e2e.yaml

    steps:
    # actions are pinned to commit SHAs so a moved tag can't change what runs
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: E2E/package-lock.json

    # throwaway values for a stack that only lives for this run
    - name: Generate secrets
      run: |
        for name in POSTGRES_PASSWORD JWT_SECRET_KEY ENCRYPTION_SECRET_KEY; do
          value="$(openssl rand -hex 32)"
          echo "::add-mask::$value"
          echo "$name=$value" >> "$GITHUB_ENV"
        done

    # builds the same images as a deployment, from this commit
    - name: Start the app
      run: docker compose up -d --build --wait

    - name: Install dependencies
      working-directory: E2E
      run: npm ci --ignore-scripts

    - name: Lint
      working-directory: E2E
      run: npm run lint

    - name: Type check
      working-directory: E2E
      run: npm run typecheck

    - name: Install browsers
      working-directory: E2E
      run: npx playwright install --with-deps chromium firefox webkit

    - name: Test
      working-directory: E2E
      run: npx playwright test

    - name: Upload report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-report
        path: E2E/playwright-report/
        retention-days: 14

    - name: Show app logs
      if: failure()
      run: docker compose logs --no-color

    - name: Stop the app
      if: always()
      run: docker compose down --volumes
